name: Code

on:
  push:
    branches: [main, releases/v0.6.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: locked
            node: "24"
          - stack: deploy-v1
            node: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: npm install --global yarn@1.22.22
      - name: Install locked stack
        if: matrix.stack == 'locked'
        run: yarn install --frozen-lockfile
      - name: Install deploy-v1 consumer stack
        if: matrix.stack == 'deploy-v1'
        run: yarn add --dev --exact --ignore-engines hardhat@2.29.0 ethers@6.17.0 hardhat-deploy@1.0.4 @nomicfoundation/hardhat-ethers@3.1.3 @openzeppelin/hardhat-upgrades@2.5.1 typescript@5.9.3 @types/node@24.0.0
      - run: yarn build
      - run: yarn tsc --noEmit
      - run: yarn test
      - name: Check formatting
        if: matrix.stack == 'locked'
        run: yarn format
      - name: Pack compiled distribution
        run: |
          mkdir -p "$RUNNER_TEMP/helpers-pack"
          npm pack --pack-destination "$RUNNER_TEMP/helpers-pack"
      - uses: actions/upload-artifact@v4
        with:
          name: helpers-${{ matrix.stack }}
          path: ${{ runner.temp }}/helpers-pack/*.tgz
